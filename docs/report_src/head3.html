<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  @page { size: 1400px 711px; margin: 0; }
  * { box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  :root { --paper:#f5f3ec; --magenta:#f2247a; --p-pink:#f2a8c4; --ink:#1e1e3f;
          --grey:#6a6880; --rule:#dcd8ca; }
  body { margin:0; font-family:Archivo,-apple-system,sans-serif; color:var(--ink); background:var(--paper); }
  .page { width:1400px; height:711px; position:relative; overflow:hidden; background:var(--paper);
          page-break-after:always; }
  .page:last-child { page-break-after:auto; }
  /* cover */
  .brand { position:absolute; top:50px; left:62px; font-size:26px; font-weight:700;
           color:var(--magenta); letter-spacing:-0.025em; z-index:3; }
  .arrow { position:absolute; top:46px; right:72px; width:46px; height:46px; border:2px solid var(--ink);
           border-radius:50%; z-index:3; display:flex; align-items:center; justify-content:center;
           font-size:20px; color:var(--ink); }
  .bigtitle { position:absolute; top:104px; left:56px; z-index:3; font-family:Anton,Impact,sans-serif;
              color:var(--magenta); font-size:132px; line-height:0.83; letter-spacing:0.005em;
              text-transform:uppercase; }
  .sub { position:absolute; bottom:72px; left:62px; z-index:3; font-size:22px; line-height:1.33;
         font-weight:500; color:var(--ink); letter-spacing:-0.01em; }
  .stamp { position:absolute; bottom:34px; left:63px; z-index:3; font-family:"IBM Plex Mono",monospace;
           font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--grey); }
  .gridwrap { position:absolute; top:22px; left:706px; width:820px; z-index:1; overflow:hidden;
              font-family:"IBM Plex Mono",monospace; font-size:16px; line-height:1.62; letter-spacing:0.30em;
              white-space:nowrap; }
  .gr span.cold{color:#dedac9;} .gr span.warm{color:var(--p-pink);} .gr span.hot{color:var(--magenta);font-weight:600;}
  /* content */
  .body { padding:46px 62px 62px 62px; height:711px; overflow:hidden;
          display:flex; flex-direction:column; }
  .kicker { font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:0.2em;
            text-transform:uppercase; color:var(--magenta); font-weight:600; margin-bottom:9px; }
  h1 { font-family:Anton,Impact,sans-serif; font-size:54px; line-height:0.95; margin:0 0 9px 0;
       text-transform:uppercase; letter-spacing:0.008em; }
  .lead { font-size:17.5px; line-height:1.46; font-weight:500; max-width:74em; margin:0 0 16px 0;
          letter-spacing:-0.008em; }
  p { font-size:13.5px; line-height:1.5; margin:0 0 9px 0; }
  .pink { color:var(--magenta); } b,strong { font-weight:700; }
  /* flow */
  .flow { display:flex; align-items:stretch; gap:0; margin:14px 0 14px 0; }
  .step { flex:1; position:relative; padding:0 15px 0 0; }
  .step:last-child { padding-right:0; }
  .stepnum { font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:0.14em;
             color:var(--grey); margin-bottom:6px; }
  .stepbox { border-top:3px solid var(--ink); padding-top:9px; height:100%; }
  .step.key .stepbox { border-top-color:var(--magenta); }
  .step h3 { font-size:16px; margin:0 0 5px 0; font-weight:700; letter-spacing:-0.01em; line-height:1.2; }
  .step p { font-size:13px; line-height:1.46; color:#3c3a55; margin:0; }
  .step .big { font-family:Anton,Impact,sans-serif; font-size:33px; color:var(--magenta);
               line-height:1; margin:7px 0 2px 0; }
  .step .biglab { font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:0.1em;
                  text-transform:uppercase; color:var(--grey); }
  .arrowrow { display:flex; margin:0 0 14px 0; }
  .arrowrow div { flex:1; text-align:right; padding-right:5px; color:var(--p-pink); font-size:15px; }
  .arrowrow div:last-child { visibility:hidden; }
  .band { background:#edeade; border-left:4px solid var(--magenta); padding:17px 22px; margin-top:auto; }
  .band p { margin:0; font-size:15px; line-height:1.52; }
  .cards { display:flex; gap:19px; margin:14px 0 0 0; }
  .card { flex:1; border-top:3px solid var(--magenta); padding-top:9px; }
  .card h3 { font-size:15px; margin:0 0 4px 0; font-weight:700; letter-spacing:-0.01em; }
  .card p { font-size:12.8px; line-height:1.46; color:#3c3a55; margin:0; }
  .foot { position:absolute; bottom:26px; left:62px; right:62px; font-family:"IBM Plex Mono",monospace;
          font-size:9.5px; color:var(--grey); letter-spacing:0.09em; display:flex;
          justify-content:space-between; border-top:1px solid var(--rule); padding-top:9px;
          text-transform:uppercase; }

  .strip { display:flex; gap:19px; margin:20px 0 0 0; }
  .chip { flex:1; background:#edeade; border-radius:3px; padding:11px 15px; }
  .chip .lab { font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:0.12em;
               text-transform:uppercase; color:var(--magenta); font-weight:600; margin-bottom:5px; }
  .chip p { margin:0; font-size:12.5px; line-height:1.44; color:#3c3a55; }
  .chip b { color:var(--ink); }
  .striptitle { font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:0.16em;
                text-transform:uppercase; color:var(--grey); margin:22px 0 0 0; }
</style></head><body>
